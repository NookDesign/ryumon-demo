      <stop offset="0" stop-color="#7a1820" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#4a0e14" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1a0f0e" stop-opacity="0"/>
