    <path d="M100 206 C108 214 112 216 122 216 M500 206 C492 214 488 216 478 216" stroke-width="2.4"/>
    <path d="M150 230 C200 228 240 206 300 198 C360 206 400 228 450 230" stroke-width="1.2" opacity="0.8"/>
