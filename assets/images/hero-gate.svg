    <!-- 雲（韓国伝統の雲文をイメージ） -->
    <path d="M86 330 c0 -14 16 -20 26 -12 c4 -14 26 -14 30 0 c10 -6 24 0 22 12 H86 Z" stroke-width="1" opacity="0.7"/>
